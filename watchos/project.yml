# XcodeGen spec: генерирует WatchBridgeWatchOS.xcodeproj из текстового файла.
# Установка: brew install xcodegen; затем xcodegen generate
name: WatchBridgeWatchOS
options:
  bundleIdPrefix: com.watchbridge
  deploymentTarget:
    watchOS: "9.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  WatchBridgeWatchOS:
    type: application
    platform: watchOS
    sources:
      - WatchBridgeWatchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchbridge.watchos
        PRODUCT_NAME: WatchBridgeWatchOS
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WatchBridge
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "WatchBridge использует Bluetooth для связи с Android-телефоном"
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "WatchBridge подключается к телефону по Bluetooth LE"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
