# XcodeGen spec: генерирует WristRelayWatchOS.xcodeproj из текстового файла.
# Установка: brew install xcodegen; затем xcodegen generate
name: WristRelayWatchOS
options:
  bundleIdPrefix: com.wristrelay
  deploymentTarget:
    watchOS: "9.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  WristRelayWatchOS:
    type: application
    platform: watchOS
    sources:
      - WristRelayWatchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wristrelay.watch
        PRODUCT_NAME: WristRelayWatchOS
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WristRelay
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "WristRelay использует Bluetooth для связи с Android-телефоном"
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "WristRelay подключается к телефону по Bluetooth LE"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
