name: watchos-build

on:
  push:
    paths:
      - 'proto/**'
      - 'watchos/**'
      - '.github/workflows/watchos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: watchos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for watchOS Simulator (no signing)
        run: |
          xcodebuild \
            -project WristRelayWatchOS.xcodeproj \
            -scheme WristRelayWatchOS \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: WristRelayWatchOS-simulator
          path: |
            watchos/build/Build/Products/Debug-iphonesimulator/WristRelayWatchOS.app
          if-no-files-found: error
